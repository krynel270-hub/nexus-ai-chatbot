<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NexusAI — Powered by Gemini</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,300&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg-deep:    #07080d;
      --bg-surface: #0f1117;
      --bg-card:    #141720;
      --bg-input:   #1a1e2b;
      --border:     rgba(255,255,255,0.07);
      --accent:     #00e5ff;
      --accent2:    #7c5cfc;
      --accent3:    #ff6b6b;
      --text-1:     #f0f2ff;
      --text-2:     #8a90a8;
      --text-3:     #555a70;
      --user-bg:    linear-gradient(135deg, #7c5cfc 0%, #00e5ff 100%);
      --ai-bg:      #1a1e2b;
      --radius-lg:  18px;
      --radius-sm:  10px;
      --font-head:  'Syne', sans-serif;
      --font-body:  'DM Sans', sans-serif;
    }

    html, body {
      height: 100%;
      background: var(--bg-deep);
      color: var(--text-1);
      font-family: var(--font-body);
      font-size: 15px;
      line-height: 1.6;
      overflow: hidden;
    }

    body::before {
      content: '';
      position: fixed; inset: 0; z-index: 0;
      background:
        radial-gradient(ellipse 60% 50% at 10% 20%, rgba(124,92,252,0.12) 0%, transparent 60%),
        radial-gradient(ellipse 50% 40% at 90% 80%, rgba(0,229,255,0.08) 0%, transparent 60%);
      pointer-events: none;
    }

    #app {
      position: relative; z-index: 1;
      display: flex; flex-direction: column;
      height: 100vh; max-width: 820px;
      margin: 0 auto; padding: 0 16px;
    }

    /* HEADER */
    header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 20px 0 16px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    .logo { display: flex; align-items: center; gap: 12px; }
    .logo-icon {
      width: 38px; height: 38px; border-radius: 12px;
      background: linear-gradient(135deg, #7c5cfc, #00e5ff);
      display: grid; place-items: center; flex-shrink: 0;
      box-shadow: 0 0 20px rgba(0,229,255,0.3);
    }
    .logo-icon svg { width: 20px; height: 20px; }
    .logo-text {
      font-family: var(--font-head);
      font-size: 1.25rem; font-weight: 800;
      letter-spacing: -0.5px;
      background: linear-gradient(90deg, #fff 30%, #00e5ff);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }
    .logo-sub { font-size: 0.72rem; color: var(--text-3); margin-top: -2px; letter-spacing: 0.5px; }

    .header-right { display: flex; align-items: center; gap: 10px; }

    #api-status {
      display: flex; align-items: center; gap: 7px;
      padding: 5px 12px; border-radius: 99px;
      background: var(--bg-card); border: 1px solid var(--border);
      font-size: 0.72rem; font-weight: 500; color: var(--text-2);
    }
    #api-status .dot {
      width: 7px; height: 7px; border-radius: 50%;
      background: #2ecc71; box-shadow: 0 0 8px #2ecc71;
      animation: pulse-dot 2s infinite;
    }
    #api-status.error .dot { background: var(--accent3); }
    @keyframes pulse-dot { 0%,100%{opacity:1;} 50%{opacity:.4;} }

    #clear-btn {
      width: 36px; height: 36px; border-radius: 10px;
      background: var(--bg-card); border: 1px solid var(--border);
      color: var(--text-2); cursor: pointer;
      display: grid; place-items: center;
      transition: all .2s; outline: none;
    }
    #clear-btn:hover { background: rgba(255,107,107,.12); color: var(--accent3); }

    /* MESSAGES */
    #messages {
      flex: 1; overflow-y: auto; padding: 24px 0 8px;
      display: flex; flex-direction: column; gap: 20px;
      scrollbar-width: thin; scrollbar-color: var(--bg-card) transparent;
    }

    #welcome {
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      flex: 1; text-align: center; padding: 40px 20px;
      gap: 16px; animation: fadeUp .5s ease both;
    }
    .welcome-orb {
      width: 80px; height: 80px; border-radius: 24px;
      background: linear-gradient(135deg, #7c5cfc 0%, #00e5ff 100%);
      display: grid; place-items: center;
      box-shadow: 0 0 40px rgba(0,229,255,0.25);
      animation: float 3s ease-in-out infinite;
    }
    .welcome-orb svg { width: 40px; height: 40px; }
    @keyframes float { 0%,100%{transform:translateY(0);} 50%{transform:translateY(-8px);} }
    @keyframes fadeUp { from{opacity:0;transform:translateY(12px);} to{opacity:1;} }
    
    #welcome h1 { font-family: var(--font-head); font-size: 2rem; font-weight: 800; }
    #welcome p { color: var(--text-2); max-width: 380px; font-size: 0.95rem; }

    .suggestions { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 8px; }
    .chip {
      padding: 8px 14px; border-radius: 99px;
      background: var(--bg-card); border: 1px solid var(--border);
      color: var(--text-2); font-size: 0.82rem; cursor: pointer;
      transition: all .2s; font-family: var(--font-body);
    }
    .chip:hover { border-color: var(--accent); color: var(--accent); }

    /* MESSAGE BUBBLE */
    .msg { display: flex; gap: 12px; animation: fadeUp .3s ease both; max-width: 100%; }
    .msg.user { flex-direction: row-reverse; }

    .avatar {
      width: 34px; height: 34px; border-radius: 10px;
      flex-shrink: 0; display: grid; place-items: center; align-self: flex-end;
    }
    .msg.user .avatar { background: var(--user-bg); box-shadow: 0 4px 16px rgba(124,92,252,0.35); }
    .msg.ai .avatar { background: linear-gradient(135deg, #1a1e2b, #0f1117); border: 1px solid var(--border); }

    .bubble {
      max-width: min(72%, 580px); padding: 13px 16px;
      border-radius: var(--radius-lg); line-height: 1.7;
      font-size: 0.93rem; word-break: break-word;
    }
    .msg.user .bubble {
      background: var(--user-bg);
      color: #fff; border-bottom-right-radius: 5px;
      box-shadow: 0 4px 24px rgba(124,92,252,0.25);
    }
    .msg.ai .bubble {
      background: var(--ai-bg); border: 1px solid var(--border);
      color: var(--text-1); border-bottom-left-radius: 5px;
    }

    .bubble pre {
      background: #0a0c12; border: 1px solid rgba(255,255,255,0.08);
      border-radius: 10px; padding: 14px 16px; margin: 10px 0;
      overflow-x: auto; font-size: 0.82rem; line-height: 1.6;
      font-family: 'Courier New', monospace;
    }
    .bubble code { font-family: 'Courier New', monospace; font-size: 0.88em; }
    .bubble p { margin-bottom: 8px; }
    .bubble p:last-child { margin-bottom: 0; }

    /* TYPING INDICATOR */
    .typing-indicator { display: flex; gap: 5px; align-items: center; padding: 14px 18px; }
    .typing-indicator span {
      width: 7px; height: 7px; border-radius: 50%;
      background: var(--accent);
      animation: bounce .8s ease-in-out infinite;
    }
    .typing-indicator span:nth-child(2) { animation-delay: .12s; background: var(--accent2); }
    .typing-indicator span:nth-child(3) { animation-delay: .24s; background: var(--accent3); }
    @keyframes bounce { 0%,60%,100%{transform:translateY(0);} 30%{transform:translateY(-7px);} }

    /* INPUT AREA */
    #input-area { padding: 14px 0 20px; flex-shrink: 0; }
    .input-wrap {
      display: flex; align-items: flex-end; gap: 10px;
      background: var(--bg-input); border: 1px solid var(--border);
      border-radius: var(--radius-lg); padding: 10px 10px 10px 16px;
      transition: all .2s;
    }
    .input-wrap:focus-within {
      border-color: rgba(0,229,255,0.4);
      box-shadow: 0 0 0 3px rgba(0,229,255,0.06);
    }
    #user-input {
      flex: 1; background: transparent; border: none; outline: none;
      color: var(--text-1); font-family: var(--font-body);
      font-size: 0.95rem; resize: none; max-height: 180px;
      min-height: 26px; line-height: 1.6;
    }
    #user-input::placeholder { color: var(--text-3); }

    #send-btn {
      width: 40px; height: 40px; border-radius: 12px; flex-shrink: 0;
      background: linear-gradient(135deg, #7c5cfc, #00e5ff);
      border: none; cursor: pointer; display: grid; place-items: center;
      transition: all .2s;
    }
    #send-btn:hover:not(:disabled) { transform: scale(1.06); }
    #send-btn:disabled { opacity: 0.4; cursor: not-allowed; }
    #send-btn svg { width: 18px; height: 18px; }

    .input-footer {
      display: flex; justify-content: space-between; align-items: center;
      margin-top: 8px; padding: 0 4px;
      font-size: 0.72rem; color: var(--text-3);
    }

    /* TOAST */
    #toast {
      position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%) translateY(20px);
      background: var(--bg-card); border: 1px solid var(--border);
      color: var(--text-1); padding: 10px 20px; border-radius: 99px;
      font-size: 0.82rem; pointer-events: none; opacity: 0;
      transition: all .35s; z-index: 999;
    }
    #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    #toast.error { border-color: rgba(255,107,107,.4); color: var(--accent3); }
    #toast.success { border-color: rgba(46,204,113,.4); color: #2ecc71; }

    .scroll-anchor { height: 1px; }

    @media (max-width: 600px) {
      .bubble { max-width: 85%; }
      #welcome h1 { font-size: 1.5rem; }
    }
  </style>
</head>
<body>
<div id="app">

  <!-- HEADER -->
  <header>
    <div class="logo">
      <div class="logo-icon">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <div>
        <div class="logo-text">NexusAI</div>
        <div class="logo-sub">POWERED BY GEMINI</div>
      </div>
    </div>
    <div class="header-right">
      <div id="api-status">
        <span class="dot"></span>
        <span id="status-text">Ready</span>
      </div>
      <button id="clear-btn" onclick="clearChat()" title="Hapus percakapan">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 01-2 2H8a2 2 0 01-2-2L5 6"/><path d="M10 11v6M14 11v6"/><path d="M9 6V4a1 1 0 011-1h4a1 1 0 011 1v2"/>
        </svg>
      </button>
    </div>
  </header>

  <!-- MESSAGES -->
  <div id="messages">
    <div id="welcome">
      <div class="welcome-orb">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5" stroke="white" stroke-width="2"/>
        </svg>
      </div>
      <h1>Halo, ada yang bisa dibantu?</h1>
      <p>Tanya apa saja — saya siap membantu dengan pengetahuan, kreativitas, dan logika.</p>
      <div class="suggestions">
        <button class="chip" onclick="useSuggestion(this)">✍️ Bantu menulis esai</button>
        <button class="chip" onclick="useSuggestion(this)">💻 Jelaskan pemrograman</button>
        <button class="chip" onclick="useSuggestion(this)">🌍 Terjemahkan teks</button>
        <button class="chip" onclick="useSuggestion(this)">🧠 Brainstorm ide</button>
        <button class="chip" onclick="useSuggestion(this)">📊 Analisis data</button>
        <button class="chip" onclick="useSuggestion(this)">🔧 Debug kode</button>
      </div>
    </div>
    <div class="scroll-anchor" id="scroll-end"></div>
  </div>

  <!-- INPUT -->
  <div id="input-area">
    <div class="input-wrap">
      <textarea
        id="user-input"
        placeholder="Tulis pesan di sini… (Enter kirim, Shift+Enter baris baru)"
        rows="1"
      ></textarea>
      <button id="send-btn" onclick="sendMessage()" title="Kirim">
        <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.2" stroke-linecap="round">
          <line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/>
        </svg>
      </button>
    </div>
    <div class="input-footer">
      <span>Enter kirim • Shift+Enter baris baru</span>
      <span id="key-info">Backend ready</span>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
  /* ════════════════════════════════════════════════
     🔧 CONFIG - GANTI SESUAI URL VERCEL KAMU
     ════════════════════════════════════════════════ */
  const BACKEND_URL = "https://nexus-ai-chatbot.vercel.app/api/chat";
  // ☝️ GANTI dengan URL Vercel kamu yang sebenarnya!

  /* ── State ── */
  let isLoading = false;
  let conversation = [];

  /* ── DOM ── */
  const msgContainer  = document.getElementById("messages");
  const userInput     = document.getElementById("user-input");
  const sendBtn       = document.getElementById("send-btn");
  const apiStatus     = document.getElementById("api-status");
  const statusText    = document.getElementById("status-text");
  const toastEl       = document.getElementById("toast");
  const welcomeEl     = document.getElementById("welcome");
  const scrollEnd     = document.getElementById("scroll-end");

  /* ════════════════════════════════════════════════
     💬 SEND MESSAGE
     ════════════════════════════════════════════════ */
  async function sendMessage() {
    const text = userInput.value.trim();
    if (!text || isLoading) return;

    if (welcomeEl) welcomeEl.style.display = "none";

    isLoading = true;
    sendBtn.disabled = true;
    userInput.value = "";
    autoResize(userInput);

    appendMessage("user", text);
    const typingBubble = appendTyping();

    try {
      const response = await fetch(BACKEND_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          messages: conversation,
          userMessage: text,
        }),
      });

      if (!response.ok) {
        const errData = await response.json().catch(() => ({}));
        throw new Error(errData.error || `HTTP ${response.status}`);
      }

      const data = await response.json();
      const reply = data.reply;

      conversation.push({ role: "user", parts: [{ text }] });
      conversation.push({ role: "model", parts: [{ text: reply }] });

      typingBubble.remove();
      appendMessage("ai", reply);

      apiStatus.className = "";
      statusText.textContent = `Key ${data.keyIndex} (${data.availableKeys}/${data.availableKeys})`;
      showToast("✓ Respons diterima", "success");

    } catch (err) {
      typingBubble.remove();
      apiStatus.classList.add("error");
      statusText.textContent = "Error";
      appendMessage("ai", `❌ **Error:** ${err.message}`);
      showToast(`Error: ${err.message}`, "error");
    } finally {
      isLoading = false;
      sendBtn.disabled = false;
      userInput.focus();
    }
  }

  /* ════════════════════════════════════════════════
     🖼️ APPEND MESSAGE
     ════════════════════════════════════════════════ */
  function appendMessage(role, text) {
    const isUser = role === "user";
    const msg = document.createElement("div");
    msg.className = `msg ${isUser ? "user" : "ai"}`;

    const avatar = document.createElement("div");
    avatar.className = "avatar";
    avatar.innerHTML = isUser
      ? `<svg width="16" height="16" viewBox="0 0 24 24" fill="white"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>`
      : `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#00e5ff" stroke-width="2"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg>`;

    const bubble = document.createElement("div");
    bubble.className = "bubble";
    bubble.innerHTML = isUser ? escapeHtml(text) : formatText(text);

    msg.appendChild(avatar);
    msg.appendChild(bubble);
    msgContainer.insertBefore(msg, scrollEnd);
    scrollToBottom();
  }

  function appendTyping() {
    const msg = document.createElement("div");
    msg.className = "msg ai";
    msg.innerHTML = `
      <div class="avatar">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#00e5ff" stroke-width="2">
          <path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/>
        </svg>
      </div>
      <div class="bubble ai">
        <div class="typing-indicator">
          <span></span><span></span><span></span>
        </div>
      </div>`;
    msgContainer.insertBefore(msg, scrollEnd);
    scrollToBottom();
    return msg;
  }

  function scrollToBottom() {
    setTimeout(() => scrollEnd.scrollIntoView({ behavior: "smooth" }), 50);
  }

  /* ════════════════════════════════════════════════
     ✨ FORMAT TEXT
     ════════════════════════════════════════════════ */
  function formatText(text) {
    let html = escapeHtml(text);
    html = html.replace(/```(\w*)\n?([\s\S]*?)```/g, (_, _, code) => `<pre><code>${code.trim()}</code></pre>`);
    html = html.replace(/`([^`]+)`/g, '<code>$1</code>');
    html = html.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
    html = html.replace(/__(.+?)__/g, '<strong>$1</strong>');
    html = html.replace(/### (.+)/gm, '<h4 style="margin:10px 0 4px;font-weight:700;">$1</h4>');
    html = html.replace(/## (.+)/gm, '<h3 style="margin:12px 0 6px;font-weight:700;">$1</h3>');
    html = html.replace(/# (.+)/gm, '<h2 style="margin:14px 0 8px;font-weight:700;">$1</h2>');
    return html;
  }

  function escapeHtml(str) {
    const div = document.createElement("div");
    div.textContent = str;
    return div.innerHTML;
  }

  /* ════════════════════════════════════════════════
     🍞 TOAST
     ════════════════════════════════════════════════ */
  let toastTimer = null;
  function showToast(msg, type = "info") {
    toastEl.textContent = msg;
    toastEl.className = `show${type ? " " + type : ""}`;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { toastEl.className = ""; }, 3200);
  }

  /* ════════════════════════════════════════════════
     🗑️ CLEAR CHAT
     ════════════════════════════════════════════════ */
  function clearChat() {
    conversation = [];
    const msgs = msgContainer.querySelectorAll(".msg");
    msgs.forEach(m => m.remove());
    if (welcomeEl) welcomeEl.style.display = "";
    apiStatus.className = "";
    statusText.textContent = "Ready";
    showToast("✓ Percakapan dihapus", "success");
  }

  /* ════════════════════════════════════════════════
     💡 SUGGESTIONS
     ════════════════════════════════════════════════ */
  function useSuggestion(el) {
    const txt = el.textContent.replace(/^[\p{Emoji}\s]+/u, "").trim();
    userInput.value = txt;
    autoResize(userInput);
    userInput.focus();
    sendMessage();
  }

  /* ════════════════════════════════════════════════
     📏 AUTO RESIZE
     ════════════════════════════════════════════════ */
  function autoResize(el) {
    el.style.height = "auto";
    el.style.height = Math.min(el.scrollHeight, 180) + "px";
  }

  userInput.addEventListener("input", () => autoResize(userInput));
  userInput.addEventListener("keydown", e => {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  });

  /* Init */
  userInput.focus();
</script>
</body>
</html>
